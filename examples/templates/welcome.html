<!-- A plain HTML file works as a template too: no sections, nothing to learn.
     The <title> becomes the subject, and {markers} are filled in by the
     gamemode with email_set_var. Used by 03_templates.pwn. -->
<html>
  <head><title>Welcome to {server}, {name}!</title></head>
  <body style="font-family: sans-serif; color: #222">
    <h2>Welcome, {name}!</h2>
    <p>Your account on {server} is ready. See you in game.</p>
  </body>
</html>
