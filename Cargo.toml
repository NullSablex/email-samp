[package]
name = "email_samp"
version = "1.0.0"
edition = "2024"
authors = ["NullSablex <https://github.com/NullSablex>"]
repository = "https://github.com/NullSablex/email-samp"
license = "GPL-3.0"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
samp = { package = "rust-samp", version = "3.5.0", features = ["compression", "encoding"] }
lettre = { version = "0.11.23", default-features = false, features = [
    "smtp-transport",
    "pool",
    "builder",
    "hostname",
    "rustls-tls",
] }
encoding_rs = { version = "0.8", default-features = false }
url = "2.5"
percent-encoding = "2.3"
fern = "0.7"

[package.metadata.samp]
uid = "0x342d1e233fe2a70a"
