# CodeQL advanced setup.
#
# Used instead of the *default* setup, which skips a pull request that touches
# no file of the configured languages. A docs-only PR would then have no
# analysis to compare against `master`, and a `code_scanning` branch rule
# reports "configurations not found".
#
# With no path filter, both configurations exist on every pull request. The
# categories (`/language:actions`, `/language:rust`) must match on both sides.
name: CodeQL

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # Weekly, to catch newly published queries against unchanged code.
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload the SARIF results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [ actions, rust ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          # Neither language needs a compiled build for CodeQL to extract it.
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
